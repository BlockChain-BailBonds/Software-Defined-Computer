name: Source integrity and software regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r integrations/agency-lab/requirements-dev.txt
      - name: Run integrity checks
        run: python scripts/verify_release.py
      - name: Run software suites
        run: bash scripts/verify.sh
